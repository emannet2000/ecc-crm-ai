<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · ECC-CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/public/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="elm.js"></script>
    <script>
      var app = Elm.Main.init({
        node: document.getElementById("app"),
        flags: { token: localStorage.getItem("northwind_token") },
      });

      app.ports.storeToken.subscribe(function (maybeToken) {
        if (maybeToken === null) {
          localStorage.removeItem("northwind_token");
        } else {
          localStorage.setItem("northwind_token", maybeToken);
        }
      });
    </script>
  </body>
</html>
